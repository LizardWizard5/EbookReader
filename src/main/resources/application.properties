spring.application.name=ebookreader
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# The minimum number of idle connections Hikari keeps open at all times
spring.datasource.hikari.minimum-idle=5

# The maximum number of total connections allowed in the pool
spring.datasource.hikari.maximum-pool-size=10

# How long a connection can sit completely idle before being closed and replaced (in milliseconds)
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime of a connection in the pool before it is recycled (in milliseconds)
spring.datasource.hikari.max-lifetime=1800000

# How long your app will wait to get a connection from the pool before throwing an error
spring.datasource.hikari.connection-timeout=30000
